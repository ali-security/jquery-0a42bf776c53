name: build

on:
  workflow_dispatch:

jobs:
  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_DIST: node-v0.10.48-linux-x64
      # Resolve the 2014-era devDependency tree (e.g. uglify-js 2.4.13) as of the release date
      REGISTRY: "https://:2014-05-01T18%3A05%3A32.863Z@time-machines-npm.sealsecurity.io/"
    steps:
      - uses: actions/checkout@v4

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-node0.10-${{ hashFiles('package.json') }}

      - name: Install node 0.10, npm 1.2.25 and faketime
        run: |
          curl -fsSL "https://nodejs.org/dist/v0.10.48/${NODE_DIST}.tar.gz" | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/${NODE_DIST}/bin" >> "$GITHUB_PATH"
          sudo apt-get update -q && sudo apt-get install -y -q faketime

      - name: Install dependencies
        run: |
          node -v && npm -v
          npm install --registry "$REGISTRY"
          # release-time dependencies of build/release.js
          npm install --registry "$REGISTRY" shelljs@0.2.6
          # the public tarball was packed with npm 1.2.25
          npm install --registry "$REGISTRY" -g --prefix "$RUNNER_TEMP/npm1225" npm@1.2.25

      - name: Build dist
        # The build embeds the build time (@DATE, uglify banner year); pin it to the release build time
        run: faketime '2014-05-01 17:42:30' node node_modules/grunt-cli/bin/grunt "build:*:*" uglify "dist:*"

      - name: Generate CDN copies (build/release.js generateArtifacts)
        run: |
          node -e 'var R={newVersion:require("./package.json").version,preRelease:false,complete:function(){},exec:function(){},define:function(o){R.cfg=o}};require("./build/release.js")(R);R.cfg.generateArtifacts(function(f){console.log(f)});'
          ls -l dist dist/cdn

      - name: Pack
        run: |
          # this CI-only workflow is not part of the release tree (.npmignore is shipped, so it is left as-is)
          rm -rf .github
          node "$RUNNER_TEMP/npm1225/lib/node_modules/npm/bin/npm-cli.js" pack
          mkdir -p "$RUNNER_TEMP/out"
          mv jquery-*.tgz "$RUNNER_TEMP/out/"
          tar tzvf "$RUNNER_TEMP"/out/*.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: jquery-tgz
          path: ${{ runner.temp }}/out/*.tgz
